[project]
name = "study-buddy"
version = "0.1.0"
description = "A same-origin, fixed-example study demo"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.162.4,<0.163",
  "uvicorn>=0.38,<0.50",
]

[dependency-groups]
dev = ["httpx>=0.28,<0.29", "pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
