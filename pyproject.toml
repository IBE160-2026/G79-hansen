[project]
name = "study-buddy"
version = "0.1.0"
description = "A same-origin, fixed-example study demo"
requires-python = ">=3.13,<3.14"
dependencies = [
  "botocore>=1.40,<2",
  "cryptography==50.0.2",
  "fastapi>=0.162.4,<0.163",
  "httpx>=0.28,<0.29",
  "pypdf==7.0.1",
  "supabase==2.34.1",
  "uvicorn>=0.38,<0.50",
]

[dependency-groups]
dev = ["httpx>=0.28,<0.29", "pytest>=9,<10"]
pdf-experiment = ["pypdf==7.0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
