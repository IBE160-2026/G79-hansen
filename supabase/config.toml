# Local-only disposable Save acceptance stack; Supabase CLI 3.1.0.
# Never link/push this configuration to the hosted project.
project_id = "studybuddy-save-local"

[api]
enabled = true
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54422
shadow_port = 54420
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false
openai_api_key = ""

[local_smtp]
enabled = true
port = 54424

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.s3_protocol]
enabled = true

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8000"
additional_redirect_urls = ["http://127.0.0.1:8000/api/v1/auth/callback", "http://127.0.0.1:8000/api/v1/auth/recovery/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enabled = true
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
